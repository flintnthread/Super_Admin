spring.application.name=super-admin-service
spring.config.import=\
  optional:file:${FLINT_CONFIG_DIR:./config}/application.properties,\
  optional:file:${FLINT_CONFIG_DIR:./config}/application-local.properties

# === Server ===
server.port=${SUPER_ADMIN_SERVICE_PORT:8084}
server.address=0.0.0.0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# === Database (same MySQL schema as admin-service) ===
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/flintdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# === JWT (super admin session) ===
app.jwt.secret=${SUPER_ADMIN_JWT_SECRET:}
app.jwt.expiry-hours=8

# === CORS ===
app.cors.allowed-origins=${SUPER_ADMIN_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://flintnthread.in,https://*.flintnthread.in,https://flintnthread.online,https://*.flintnthread.online}

# === Mail (SendGrid SMTP) ===
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:support@flintnthread.in}

# === Logging ===
logging.level.com.ecommerce.superadmin=INFO
logging.file.name=logs/super-admin.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
